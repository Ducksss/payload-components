name: Registry Verification

on:
  pull_request:
  # Production safety net only. PRs into dev already run this gate, so re-running
  # the full suite on every dev push just re-tests an already-verified change.
  # main is the deployed branch, so keep gating its (squash-merged) commits.
  push:
    branches:
      - main
  schedule:
    - cron: '18 19 * * *'
  workflow_dispatch:
    inputs:
      registry_url:
        description: 'Optional deployed registry URL template, e.g. https://example.com/r/{name}.json'
        required: false
        type: string

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      consumer: ${{ steps.classify.outputs.consumer || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify pull request changes
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          node tools/ci/classify-changes.mjs

  release-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun for lockfile integration coverage
        run: npm install --global bun@1.3.14

      - run: pnpm install --frozen-lockfile

      # webkit too: the `webkit-*` guards run in a WebKit project (see
      # playwright.config.ts). They own no baselines; they catch WebKit-only
      # rendering bugs that every Chromium baseline sails past.
      - run: pnpm exec playwright install --with-deps chromium webkit

      - name: Release verification
        shell: bash
        run: |
          set -o pipefail
          pnpm test:ci 2>&1 | tee payload-components-release.log

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-artifacts
          path: |
            payload-components-release.log
            playwright-report
            test-results
          if-no-files-found: ignore

  node-20-compat:
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.consumer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install Bun for lockfile integration coverage
        run: npm install --global bun@1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Node 20 compatibility
        shell: bash
        run: |
          pnpm source:build
          pnpm exec tsc --noEmit
          pnpm test:registry
          pnpm run test:install
          pnpm build:cli

  quick-checks:
    # Fast-fail lint + type-check so common errors surface in ~2 min instead of
    # waiting on the full release gate (which first installs a browser for e2e).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        shell: bash
        run: |
          pnpm lint
          pnpm format:check
          pnpm source:build
          pnpm exec tsc --noEmit

  pr-gate:
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - quick-checks
      - release-gate
      - node-20-compat
      - fresh-payload-smoke
    steps:
      - name: Require every release and smoke gate
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ||
                "${{ needs.quick-checks.result }}" != "success" ||
                "${{ needs.release-gate.result }}" != "success" ]]; then
            echo "Required checks failed, were cancelled, or were skipped."
            exit 1
          fi
          expected=success
          if [[ "${{ needs.changes.outputs.consumer }}" == "false" ]]; then expected=skipped; fi
          if [[ "${{ needs.node-20-compat.result }}" != "$expected" ||
                "${{ needs.fresh-payload-smoke.result }}" != "$expected" ]]; then
            echo "Consumer checks did not reach the expected result: $expected"
            exit 1
          fi
          echo "All required checks passed."

  fresh-payload-smoke:
    needs: changes
    if: needs.changes.outputs.consumer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: bare, shard-index: 0 }
          - { scenario: website, shard-index: 0 }
          - { scenario: website, shard-index: 1 }
          - { scenario: website, shard-index: 2 }
          - { scenario: website, shard-index: 3 }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payload_components
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SMOKE_PAYLOAD_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '3.88.0' }}
      CRON_SECRET: ci-cron-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payload_components
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: ci-payload-secret
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/payload_components
      PREVIEW_SECRET: ci-preview-secret
      SMOKE_REGISTRY_URL: ${{ github.event.inputs.registry_url || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Fresh Payload target smoke
        shell: bash
        run: |
          set -o pipefail
          if [ -n "$SMOKE_REGISTRY_URL" ]; then
            pnpm test:fresh -- --scenario "${{ matrix.scenario }}" --registry-url "$SMOKE_REGISTRY_URL" --shard-index "${{ matrix.shard-index }}" --keep-temp 2>&1 | tee payload-components-fresh.log
          else
            pnpm test:fresh -- --scenario "${{ matrix.scenario }}" --shard-index "${{ matrix.shard-index }}" --keep-temp 2>&1 | tee payload-components-fresh.log
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-payload-artifacts-${{ matrix.scenario }}-${{ matrix.shard-index }}
          path: |
            payload-components-fresh.log
            playwright-report
            test-results
            /tmp/payload-components-fresh-smoke-*
          if-no-files-found: ignore
