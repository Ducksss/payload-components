name: Registry Verification

on:
  pull_request:
  # Production safety net only. Every PR already runs this gate before it merges;
  # main is the deployed branch, so keep gating its (squash-merged) commits.
  push:
    branches:
      - main
  schedule:
    - cron: '18 19 * * *'
  workflow_dispatch:
    inputs:
      registry_url:
        description: 'Optional deployed registry URL template, e.g. https://example.com/r/{name}.json'
        required: false
        type: string

env:
  NEXT_TELEMETRY_DISABLED: '1'
  I18N_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}

concurrency:
  group: registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      consumer: ${{ steps.classify.outputs.consumer || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify pull request changes
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          node tools/ci/classify-changes.mjs

  release-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun for lockfile integration coverage
        run: npm install --global bun@1.3.14

      - run: pnpm install --frozen-lockfile

      # webkit too: the `webkit-*` guards run in a WebKit project (see
      # playwright.config.ts). They own no baselines; they catch WebKit-only
      # rendering bugs that every Chromium baseline sails past.
      - run: pnpm exec playwright install --with-deps chromium webkit

      - name: Release verification
        shell: bash
        run: |
          set -o pipefail
          pnpm test:ci 2>&1 | tee payload-components-release.log

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-artifacts
          path: |
            payload-components-release.log
            playwright-report
            test-results
          if-no-files-found: ignore

  node-20-compat:
    needs: changes
    if: needs.changes.outputs.consumer == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install Bun for lockfile integration coverage
        run: npm install --global bun@1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Node 20 compatibility
        shell: bash
        run: |
          pnpm source:build
          pnpm exec tsc --noEmit
          pnpm test:registry
          pnpm run test:install
          pnpm build:cli

  quick-checks:
    # Fast-fail lint + type-check so common errors surface in ~2 min instead of
    # waiting on the full release gate (which first installs a browser for e2e).
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        shell: bash
        run: |
          pnpm lint
          pnpm format:check
          pnpm source:build
          pnpm exec tsc --noEmit

  pr-gate:
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - quick-checks
      - release-gate
      - node-20-compat
      - fresh-payload-smoke
    steps:
      - name: Require every release and smoke gate
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ||
                "${{ needs.quick-checks.result }}" != "success" ||
                "${{ needs.release-gate.result }}" != "success" ]]; then
            echo "Required checks failed, were cancelled, or were skipped."
            exit 1
          fi
          expected=success
          if [[ "${{ needs.changes.outputs.consumer }}" == "false" ]]; then expected=skipped; fi
          if [[ "${{ needs.node-20-compat.result }}" != "$expected" ||
                "${{ needs.fresh-payload-smoke.result }}" != "$expected" ]]; then
            echo "Consumer checks did not reach the expected result: $expected"
            exit 1
          fi
          echo "All required checks passed."

  fresh-payload-smoke:
    needs: changes
    if: needs.changes.outputs.consumer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: bare, shard-index: 0 }
          - { scenario: website, shard-index: 0 }
          - { scenario: website, shard-index: 1 }
          - { scenario: website, shard-index: 2 }
          - { scenario: website, shard-index: 3 }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payload_components
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRON_SECRET: ci-cron-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payload_components
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: ci-payload-secret
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/payload_components
      PREVIEW_SECRET: ci-preview-secret
      SMOKE_REGISTRY_URL: ${{ github.event.inputs.registry_url || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # PR and push runs pin Payload 3.88.0. The nightly follows the newest
      # Payload 3 release, the fully supported line, so it still catches upstream
      # breakage. Not `latest`: once Payload 4 ships, `latest` moves to 4.x,
      # which needs Node.js 24.22.1 and stays experimental here.
      # payload-newest-smoke covers it.
      - name: Resolve the newest Payload 3 release
        id: payload
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view payload versions --json | node -e '
            const semver = require("semver")
            const versions = JSON.parse(require("fs").readFileSync(0, "utf8"))
            console.log(semver.maxSatisfying(versions, "^3.0.0") ?? "")
          ')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fresh Payload target smoke
        shell: bash
        env:
          SMOKE_PAYLOAD_VERSION: ${{ steps.payload.outputs.version || '3.88.0' }}
        run: |
          set -o pipefail
          echo "Payload: $SMOKE_PAYLOAD_VERSION"
          if [ -n "$SMOKE_REGISTRY_URL" ]; then
            pnpm test:fresh -- --scenario "${{ matrix.scenario }}" --registry-url "$SMOKE_REGISTRY_URL" --shard-index "${{ matrix.shard-index }}" --keep-temp 2>&1 | tee payload-components-fresh.log
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm test:fresh -- --scenario "${{ matrix.scenario }}" --registry-url 'https://www.payload-components.xyz/r/{name}.json' --shard-index "${{ matrix.shard-index }}" --keep-temp 2>&1 | tee payload-components-fresh.log
          else
            pnpm test:fresh -- --scenario "${{ matrix.scenario }}" --shard-index "${{ matrix.shard-index }}" --keep-temp 2>&1 | tee payload-components-fresh.log
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-payload-artifacts-${{ matrix.scenario }}-${{ matrix.shard-index }}
          path: |
            payload-components-fresh.log
            playwright-report
            test-results
            /tmp/payload-components-fresh-smoke-*
          if-no-files-found: ignore

  # Early warning for the next Payload major. The nightly smoke above follows
  # the newest Payload 3 release, so nothing else exercises Payload 4, either
  # before it ships or after. This runs the same scenarios against the newest
  # published Payload, whichever dist-tag carries it, and never fails the run,
  # because prereleases also break for upstream reasons. It is not a pr-gate
  # dependency.
  payload-newest-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: bare, shard-index: 0 }
          - { scenario: website, shard-index: 0 }
          - { scenario: website, shard-index: 1 }
          - { scenario: website, shard-index: 2 }
          - { scenario: website, shard-index: 3 }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payload_components
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRON_SECRET: ci-cron-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payload_components
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: ci-payload-secret
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/payload_components
      PREVIEW_SECRET: ci-preview-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      # Payload 4 requires Node.js 24.22.1 or newer. Without check-latest,
      # setup-node takes whichever 24.x the runner has cached, and one runner
      # handed out 24.22.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Payload moves its prerelease line between dist-tags (canary, then beta,
      # maybe rc), and the tag it leaves stops moving: `canary` froze at
      # 4.0.0-canary.39 once 4.0.0-beta.0 shipped. Take the highest major any of
      # these tags points at, `latest` included, then the build in it published
      # last, so the job follows each hand-off and the major's release. Not
      # semver order alone: that ranks 4.0.0-canary.39 above 4.0.0-beta.6.
      - name: Resolve the newest Payload release
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view payload dist-tags time --json | node -e '
            const semver = require("semver")
            const { "dist-tags": tags, time } = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const versions = ["canary", "beta", "rc", "latest"]
              .map((tag) => tags[tag])
              .filter((version) => semver.valid(version) && time[version])
            const newest = (left, right) =>
              semver.major(right) - semver.major(left) || Date.parse(time[right]) - Date.parse(time[left])
            console.log(versions.sort(newest)[0] ?? "")
          ')"
          test -n "$version"
          echo "SMOKE_PAYLOAD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Fresh newest-Payload smoke
        shell: bash
        run: |
          set -o pipefail
          echo "Payload: $SMOKE_PAYLOAD_VERSION"
          node --version
          pnpm test:fresh -- --scenario "${{ matrix.scenario }}" --shard-index "${{ matrix.shard-index }}" 2>&1 | tee payload-components-newest.log

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-newest-smoke-${{ matrix.scenario }}-${{ matrix.shard-index }}
          path: payload-components-newest.log
          if-no-files-found: ignore
