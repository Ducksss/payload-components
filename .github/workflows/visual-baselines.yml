name: Visual Baselines

# Mints per-platform Playwright visual baselines. The default targets the
# component registry; pass `blog-visual` to mint the editorial index/article
# suite. CI runs on linux, so committed darwin baselines silently skip there
# (a baseline must be generated in the renderer it is compared against). Run this
# workflow on a branch to generate the linux `*-chromium-linux.png` baselines in
# the same environment the release gate uses, then merge the PR it opens so the
# 38-component visual suite actually compares on every subsequent gate run.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Playwright spec filter to (re)generate baselines for'
        required: false
        default: 'components-visual'
        type: string
      update:
        # 'changed' (Playwright's own preset for a bare --update-snapshots) only
        # rewrites baselines whose diff exceeded maxDiffPixelRatio, so an
        # intended change that lands under the tolerance leaves a stale baseline
        # behind. Use 'all' when a change is deliberately visual and the
        # committed images must show it — but expect the run to also rewrite
        # baselines that merely drift sub-tolerance against this renderer, so
        # cherry-pick the intended files rather than merging the PR wholesale.
        description: 'Which baselines to rewrite'
        required: false
        default: 'changed'
        type: choice
        options: ['changed', 'all']

env:
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: write
  pull-requests: write

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm source:build

      # Baselines MUST be minted against the same server mode the release gate
      # compares in. `pnpm test:e2e` alone starts `pnpm dev`, while the gate runs
      # `PLAYWRIGHT_SERVER_MODE=production` (`pnpm start`) — and a dev render is
      # not pixel-identical to a production one. Minting in dev produced Linux
      # baselines that failed the gate by 1px of page height, which then cascades
      # into a whole-page diff well past maxDiffPixelRatio.
      - run: pnpm build:e2e

      - name: Update visual baselines
        env:
          # Passed as an env var, not a ${{ }} splice, so the dispatch input stays
          # shell data instead of shell code. Left unquoted on purpose: the filter
          # may name several specs (e.g. "components-visual frontend").
          SPEC: ${{ inputs.spec }}
          # Quoted at the use site: unlike SPEC this is always a single token.
          UPDATE: ${{ inputs.update }}
          # Baselines MUST be minted in the same server mode the release gate
          # compares in. Bare `pnpm test:e2e` starts `pnpm dev`, while the gate
          # runs PLAYWRIGHT_SERVER_MODE=production against `pnpm start`, and a dev
          # render is not pixel-identical to a production one.
          PLAYWRIGHT_SERVER_MODE: production
        run: pnpm test:e2e $SPEC --update-snapshots="$UPDATE"

      - name: Open PR with minted baselines
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          snapshots=tests/e2e
          if [[ -z "$(git status --porcelain "$snapshots")" ]]; then
            echo "No baseline changes — nothing to commit."
            exit 0
          fi
          branch="visual-baselines/${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$snapshots"
          git commit -m "test(chore): mint ${RUNNER_OS} visual baselines (${SPEC})"
          git push origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "test(chore): mint ${RUNNER_OS} visual baselines" \
            --body "Auto-generated by the \`visual-baselines\` workflow. Commits the per-platform \`${SPEC}\` snapshot baselines so the visual-regression suite compares (instead of skipping) on the CI gate."

      - name: Upload baselines artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/e2e/**/*-snapshots/**
          if-no-files-found: ignore
