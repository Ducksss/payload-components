name: Package Publish

on:
  release:
    types:
      - published

env:
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Action versions are kept in lockstep across all workflows (registry,
      # publish, visual-baselines) so the ref-exact Actions allowlist only has to
      # admit one major per action. Bump them together.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch candidate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --force --no-tags origin \
            main:refs/remotes/origin/main \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install trusted guard dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify candidate from trusted main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm exec tsx tools/payload-components/publish-guard.ts --tag "$RELEASE_TAG"

      - name: Checkout validated release candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Install validated release dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Full release gate
        run: pnpm test:release

      - name: Packed artifact gate
        run: pnpm test:pack

      - id: package
        name: Resolve package metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag=latest
          if [[ "$version" == *-* ]]; then
            tag=next
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        shell: bash
        run: |
          if npm view "payload-components@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "payload-components@${{ steps.package.outputs.version }} already exists on npm"
            exit 0
          fi
          npm publish --provenance --tag "${{ steps.package.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ducksss'

      - name: Prepare GitHub Packages mirror
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          pkg.name = '@ducksss/payload-components'
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Publish GitHub Packages mirror
        shell: bash
        run: |
          if npm view "@ducksss/payload-components@${{ steps.package.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@ducksss/payload-components@${{ steps.package.outputs.version }} already exists on GitHub Packages"
            exit 0
          fi
          npm publish --tag "${{ steps.package.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
