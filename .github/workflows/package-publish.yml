name: Package Publish

on:
  release:
    types:
      - published

env:
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The publish job holds NPM_TOKEN, so third-party actions are pinned to a
      # reviewed commit and admitted by that exact ref in the Actions allowlist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Fetch candidate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git -c credential.helper= \
            -c credential.helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f" \
            fetch --force --no-tags origin \
            main:refs/remotes/origin/main \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Bun for lockfile integration coverage
        run: npm install --global bun@1.3.14

      - name: Install trusted guard dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify candidate from trusted main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm exec tsx tools/payload-components/publish-guard.ts --tag "$RELEASE_TAG"

      - name: Checkout validated release candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Install validated release dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      - name: Full release gate
        run: pnpm test:release

      - name: Packed artifact gate
        run: pnpm test:pack

      - id: package
        name: Resolve package metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag=latest
          if [[ "$version" == *-* ]]; then
            tag=next
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # npm trusted publishing needs npm 11.5.1 or later, and Node 22 still bundles
      # npm 10. With a trusted publisher configured on npmjs.com, npm signs in with
      # this job's OIDC token (id-token: write) and adds provenance itself. It
      # falls back to NPM_TOKEN only if that fails.
      - name: Install an npm that supports trusted publishing
        run: npm install --global npm@11.21.0

      - name: Publish to npm
        shell: bash
        run: |
          if npm view "payload-components@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "payload-components@${{ steps.package.outputs.version }} already exists on npm"
            exit 0
          fi
          npm publish --provenance --tag "${{ steps.package.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ducksss'

      - name: Prepare GitHub Packages mirror
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          pkg.name = '@ducksss/payload-components'
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Publish GitHub Packages mirror
        shell: bash
        run: |
          if npm view "@ducksss/payload-components@${{ steps.package.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@ducksss/payload-components@${{ steps.package.outputs.version }} already exists on GitHub Packages"
            exit 0
          fi
          npm publish --tag "${{ steps.package.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
