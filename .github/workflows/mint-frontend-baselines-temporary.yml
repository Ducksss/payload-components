name: Mint Frontend Baselines (Temporary)

# Temporary bootstrap for this feature branch. The normal visual-baselines
# workflow is workflow_dispatch-only; this push trigger is removed once its
# generated Linux snapshots have landed.
on:
  push:
    branches:
      - PinZheng/curated-tailark-ports
    paths:
      - .github/workflows/mint-frontend-baselines-temporary.yml

env:
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: write
  pull-requests: write

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm source:build

      - name: Update frontend visual baselines
        run: pnpm test:e2e frontend --update-snapshots

      - name: Open PR with minted baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          snapshots=tests/e2e
          if [[ -z "$(git status --porcelain "$snapshots")" ]]; then
            echo "No baseline changes — nothing to commit."
            exit 0
          fi
          branch="visual-baselines/${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$snapshots"
          git commit -m "test(chore): mint ${RUNNER_OS} visual baselines (frontend)"
          git push origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "test(chore): mint ${RUNNER_OS} frontend baselines" \
            --body "Auto-generated Linux frontend snapshots for the curated Tailark feature branch."
