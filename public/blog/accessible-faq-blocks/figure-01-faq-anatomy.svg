<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Semantics, state, and keyboard behavior are one contract</title>
  <desc id="description">ACCESSIBLE DISCLOSURE diagram for the Payload Components editorial library.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#18181b" flood-opacity="0.08"/></filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <style>
      .kicker{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px;fill:#059669}
      .headline{font:650 34px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#18181b}
      .card{fill:#fff;stroke:#d4d4d8;stroke-width:1.5;filter:url(#shadow)}
      .terminal{fill:#18181b;stroke:#3f3f46;stroke-width:1.5;filter:url(#shadow)}
      .dot{fill:#059669}
      .node-title{font:650 18px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#18181b}
      .node-body{font:450 14px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#52525b}
      .terminal-title{font:650 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f4f4f5}
      .terminal-body{font:450 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#d4d4d8}
      .arrow{fill:none;stroke:#059669;stroke-width:2.5;stroke-linecap:round;opacity:.85}
      .edge-label{font:650 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#047857;paint-order:stroke;stroke:#fafafa;stroke-width:5px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1110" cy="70" r="62" fill="#059669" opacity=".06"/>
  <circle cx="1110" cy="70" r="31" fill="#059669" opacity=".08"/>
  <text class="kicker" x="60" y="55">ACCESSIBLE DISCLOSURE</text>
  <text class="headline" x="60" y="104">Semantics, state, and keyboard behavior are one contract</text>
  <g><g><path class="arrow" d="M 404 270.25 C 416 270.25, 416 270.25, 428 270.25" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 772 270.25 C 784 270.25, 784 270.25, 796 270.25" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 324 446.75 C 278 446.75, 278 348.25, 232 348.25" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 876 446.75 C 922 446.75, 922 348.25, 968 348.25" marker-end="url(#arrowhead)" /></g></g>
  <g>
        <g>
          <rect class="card" x="60" y="192.25" width="344" height="156" rx="18" />
          <circle class="dot" cx="86" cy="221.25" r="6" />
          <text class="node-title" x="104" y="227.25">&lt;button&gt;</text>
          <text class="node-body" x="86" y="262.25">Focusable question control</text>
        </g>

        <g>
          <rect class="card" x="428" y="192.25" width="344" height="156" rx="18" />
          <circle class="dot" cx="454" cy="221.25" r="6" />
          <text class="node-title" x="472" y="227.25">aria-expanded</text>
          <text class="node-body" x="454" y="262.25">Announces open or closed</text>
        </g>

        <g>
          <rect class="card" x="796" y="192.25" width="344" height="156" rx="18" />
          <circle class="dot" cx="822" cy="221.25" r="6" />
          <text class="node-title" x="840" y="227.25">Answer region</text>
          <text class="node-body" x="822" y="262.25">Stable id and relationship</text>
        </g>

        <g>
          <rect class="card" x="60" y="446.75" width="528" height="156" rx="18" />
          <circle class="dot" cx="86" cy="475.75" r="6" />
          <text class="node-title" x="104" y="481.75">Keyboard</text>
          <text class="node-body" x="86" y="516.75">Tab focuses · Enter/Space toggles</text>
        </g>

        <g>
          <rect class="card" x="612" y="446.75" width="528" height="156" rx="18" />
          <circle class="dot" cx="638" cy="475.75" r="6" />
          <text class="node-title" x="656" y="481.75">Motion</text>
          <text class="node-body" x="638" y="516.75">Never hides state or traps focus</text>
        </g></g>
</svg>
