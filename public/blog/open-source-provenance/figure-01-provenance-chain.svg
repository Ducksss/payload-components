<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="diagram-title diagram-description" class="diagram diagram--inspect" data-mode="inspect" data-series="open-source" data-issue="31">
  <title id="diagram-title">Permission and lineage travel through different records</title>
