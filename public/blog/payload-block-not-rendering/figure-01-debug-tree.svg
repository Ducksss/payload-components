          <circle class="dot" cx="86" cy="528.3333333333333" r="6" />
          <text class="node-title" x="104" y="534.3333333333333">Props valid?</text>
          <text class="node-body" x="86" y="569.3333333333333">Match generated union member</text>
        </g>

