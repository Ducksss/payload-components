          <circle class="dot" cx="454" cy="528.3333333333333" r="6" />
          <text class="node-title" x="472" y="534.3333333333333">Fresh output?</text>
          <text class="node-body" x="454" y="569.3333333333333">Regenerate types and import map</text>
        </g>

        <g>
          <rect class="card" x="796" y="499.3333333333333" width="344" height="135.66666666666666" rx="18" />
          <circle class="dot" cx="822" cy="528.3333333333333" r="6" />
          <text class="node-title" x="840" y="534.3333333333333">Render restored</text>
          <text class="node-body" x="822" y="569.3333333333333">Verify editor and frontend</text>
