<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="diagram-title diagram-description" class="diagram diagram--trace" data-mode="trace" data-series="component-design" data-issue="15">
  <title id="diagram-title">Four shipped Feature variants replace one hidden prop matrix</title>
  <desc id="diagram-description">The real Feature family keeps structural choices in separate registry items while sharing editorial vocabulary.</desc>
