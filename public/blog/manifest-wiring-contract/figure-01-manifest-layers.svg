<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="diagram-title diagram-description" class="diagram diagram--inspect" data-mode="inspect" data-series="installer-internals" data-issue="11">
  <title id="diagram-title">Manifest declarations drive the plan; state records the outcome</title>
