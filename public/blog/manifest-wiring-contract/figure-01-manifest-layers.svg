<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">The manifest describes installation beyond file delivery</title>
  <desc id="description">EXECUTABLE CONTRACT diagram for the Payload Components editorial library.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#18181b" flood-opacity="0.08"/></filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <style>
      .kicker{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px;fill:#059669}
      .headline{font:650 34px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#18181b}
      .card{fill:#fff;stroke:#d4d4d8;stroke-width:1.5;filter:url(#shadow)}
      .terminal{fill:#18181b;stroke:#3f3f46;stroke-width:1.5;filter:url(#shadow)}
      .dot{fill:#059669}
      .node-title{font:650 18px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#18181b}
      .node-body{font:450 14px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#52525b}
      .terminal-title{font:650 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f4f4f5}
      .terminal-body{font:450 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#d4d4d8}
      .arrow{fill:none;stroke:#059669;stroke-width:2.5;stroke-linecap:round;opacity:.85}
      .edge-label{font:650 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#047857;paint-order:stroke;stroke:#fafafa;stroke-width:5px}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1110" cy="70" r="62" fill="#059669" opacity=".06"/>
  <circle cx="1110" cy="70" r="31" fill="#059669" opacity=".08"/>
  <text class="kicker" x="60" y="55">EXECUTABLE CONTRACT</text>
  <text class="headline" x="60" y="104">The manifest describes installation beyond file delivery</text>
  <g><g><path class="arrow" d="M 312 270.25 C 276 270.25, 276 524.75, 240 524.75" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 462 348.25 C 531 348.25, 531 435.75, 600 435.75" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 738 348.25 C 669 348.25, 669 435.75, 600 435.75" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 888 270.25 C 924 270.25, 924 524.75, 960 524.75" marker-end="url(#arrowhead)" /></g></g>
  <g>
        <g>
          <rect class="card" x="60" y="192.25" width="252" height="156" rx="18" />
          <circle class="dot" cx="86" cy="221.25" r="6" />
          <text class="node-title" x="104" y="227.25">Files</text>
          <text class="node-body" x="86" y="262.25">Owned paths and targets</text>
        </g>

        <g>
          <rect class="card" x="336" y="192.25" width="252" height="156" rx="18" />
          <circle class="dot" cx="362" cy="221.25" r="6" />
          <text class="node-title" x="380" y="227.25">Dependencies</text>
          <text class="node-body" x="362" y="262.25">Public packages</text>
        </g>

        <g>
          <rect class="card" x="612" y="192.25" width="252" height="156" rx="18" />
          <circle class="dot" cx="638" cy="221.25" r="6" />
          <text class="node-title" x="656" y="227.25">Fragments</text>
          <text class="node-body" x="638" y="262.25">Anchored host-file edits</text>
        </g>

        <g>
          <rect class="card" x="888" y="192.25" width="252" height="156" rx="18" />
          <circle class="dot" cx="914" cy="221.25" r="6" />
          <text class="node-title" x="932" y="227.25">Post-install</text>
          <text class="node-body" x="914" y="262.25">Types + import map</text>
        </g>

        <g>
          <rect class="card" x="240" y="435.75" width="720" height="178" rx="18" />
          <circle class="dot" cx="266" cy="464.75" r="6" />
          <text class="node-title" x="284" y="470.75">Install state</text>
          <text class="node-body" x="266" y="505.75">Version, stage, files, patches, recovery status</text>
        </g></g>
</svg>
