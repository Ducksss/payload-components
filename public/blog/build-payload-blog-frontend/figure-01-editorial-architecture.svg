<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="diagram-title diagram-description" class="diagram diagram--trace" data-mode="trace" data-series="production-guides" data-issue="22">
  <title id="diagram-title">One validated MDX entry feeds every shipped blog surface</title>
  <desc id="diagram-description">The repository blog is MDX-backed; consumers can substitute a selected Payload Post without changing the projection boundaries.</desc>
  <defs>
    <pattern id="journal-grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e4e4e7" stroke-width="1" />
    </pattern>
    <marker id="journal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
    </marker>
    <style>
      .diagram {
        background: #f7f5ef;
        color: #18181b;
      }
      .paper {
        fill: #f7f5ef;
      }
      .grid {
        fill: url(#journal-grid-pattern);
      }
      .masthead,
      .mode-label,
      .folio-label,
      .footer-label,
      .node-index,
      .edge-label,
      .node-title--mono,
      .node-body--mono,
      .provenance-line {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .masthead {
        fill: #18181b;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.7px;
      }
      .kicker {
        fill: #047857;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 1.5px;
      }
      .headline {
        fill: #18181b;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 28px;
        font-weight: 720;
        letter-spacing: -0.4px;
      }
      .mode-box {
        fill: #ffffff;
        stroke: #047857;
        stroke-width: 2;
      }
      .mode-label {
        fill: #047857;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 1.4px;
      }
      .folio-label {
        fill: #52525b;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 1.2px;
      }
      .journal-rule {
        stroke: #18181b;
        stroke-width: 1;
      }
      .accent-path {
        fill: none;
        stroke: #059669;
        stroke-linecap: round;
        stroke-width: 2.5;
      }
      .edge-path {
        fill: none;
        stroke: #059669;
        stroke-linecap: round;
        stroke-width: 2.25;
      }
      .diagram--join .edge-path {
        stroke-dasharray: 7 5;
      }
      .diagram--inspect .edge-path {
        stroke-width: 1.75;
      }
      .edge-label-paper {
        fill: #f7f5ef;
        stroke: #e4e4e7;
        stroke-width: 1;
      }
      .edge-label {
        fill: #047857;
        font-size: 13px;
        font-weight: 700;
      }
      .node-card {
        fill: #ffffff;
        stroke: #d4d4d8;
        stroke-width: 1.25;
      }
      .diagram--inspect .node-card {
        stroke: #18181b;
      }
      .node--terminal .node-card {
        fill: #18181b;
        stroke: #18181b;
      }
      .node-rule {
        stroke: #059669;
        stroke-width: 5;
      }
      .node-index {
        fill: #047857;
        font-size: 13px;
        font-weight: 700;
      }
      .node-title {
        fill: #18181b;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 720;
      }
      .node-body {
        fill: #52525b;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 480;
      }
      .node--terminal .node-title,
      .node--terminal .node-body {
        fill: #ffffff;
      }
      .node--terminal .node-index {
        fill: #059669;
      }
      .footer-paper {
        fill: #ffffff;
        stroke: #d4d4d8;
        stroke-width: 1;
      }
      .footer-label {
        fill: #047857;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .provenance-line,
      .evidence-line {
        fill: #52525b;
        font-size: 13px;
      }
      .evidence-line {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .prompt {
        fill: #047857;
        font-family: Georgia, serif;
        font-size: 16px;
        font-style: italic;
        font-weight: 650;
      }
      .registration {
        fill: none;
        stroke: #047857;
        stroke-width: 1.5;
      }
