  <path class="node-rule" d="M 52 215 H 402.6666666666667" />
  <text class="node-index" x="68" y="236">01</text>
  <text class="node-title node-title--mono" x="95" y="237">content/blog/&lt;slug&gt;.mdx</text>
  <text class="node-body node-body--mono" data-role="body-line" x="68" y="267">Frontmatter + MDX body</text>
</g>
<g class="node node--code" data-node-id="schema" data-node-kind="code">
  <rect class="node-card" x="424.6666666666667" y="210" width="350.6666666666667" height="116" rx="2" />
  <path class="node-rule" d="M 424.6666666666667 215 H 775.3333333333334" />
  <text class="node-index" x="440.6666666666667" y="236">02</text>
  <text class="node-title node-title--mono" x="467.6666666666667" y="237">source.config</text>
  <text class="node-body node-body--mono" data-role="body-line" x="440.6666666666667" y="267">Validates cover · date · order · series ·</text>
<text class="node-body node-body--mono" data-role="body-line" x="440.6666666666667" y="283">tags</text>
</g>
