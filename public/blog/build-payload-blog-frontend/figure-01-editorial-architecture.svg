</g>
<g class="edge">
  <path class="edge-path" data-edge-from="source" data-edge-to="discovery" data-edge-axis="vertical" d="M 972.6666666666667 328 C 972.6666666666667 334.5, 739 334.5, 739 341" marker-end="url(#journal-arrow)" />

</g>
