        font-weight: 750;
        letter-spacing: 1.5px;
      }
      .headline {
        fill: #18181b;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 28px;
        font-weight: 720;
        letter-spacing: -0.4px;
      }
      .mode-box {
