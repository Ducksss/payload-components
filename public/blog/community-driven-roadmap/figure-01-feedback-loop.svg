  <g data-journal-part="evidence" data-evidence-excerpt="Sort every support report into one lane first. Then ask only for the missing evidence needed to reproduce or route it.">
  <text class="footer-label" x="48" y="607">EVIDENCE EXCERPT</text>
  <text class="evidence-line" x="48" y="626">Sort every support report into one lane first. Then ask only for the</text>
<text class="evidence-line" x="48" y="641">missing evidence needed to reproduce or route it.</text>
</g>
  <g data-journal-part="prompt" data-prompt="Bring a reproducible need, not a screenshot wishlist.">
