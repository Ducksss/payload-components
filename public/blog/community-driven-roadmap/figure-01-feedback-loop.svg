<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="diagram-title diagram-description" class="diagram diagram--join" data-mode="join" data-series="open-source" data-issue="32">
  <title id="diagram-title">Real installs become routed evidence, reviewed work, and future releases</title>
  <desc id="diagram-description">The loop preserves a private route for security reports and describes releases as available to install rather than automatically adopted.</desc>
  <defs>
    <pattern id="journal-grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e4e4e7" stroke-width="1" />
    </pattern>
    <marker id="journal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
    </marker>
    <style>
      .diagram {
        background: #f7f5ef;
        color: #18181b;
      }
      .paper {
        fill: #f7f5ef;
      }
