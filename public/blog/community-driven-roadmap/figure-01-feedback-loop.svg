        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 480;
      }
      .node--terminal .node-title,
      .node--terminal .node-body {
        fill: #ffffff;
      }
      .node--terminal .node-index {
        fill: #059669;
      }
