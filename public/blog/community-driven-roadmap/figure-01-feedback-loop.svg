          <circle class="dot" cx="454" cy="221.25" r="6" />
          <text class="node-title" x="472" y="227.25">Feedback</text>
          <text class="node-body" x="454" y="262.25">Specific friction and context</text>
        </g>

        <g>
          <rect class="card" x="796" y="192.25" width="344" height="156" rx="18" />
          <circle class="dot" cx="822" cy="221.25" r="6" />
          <text class="node-title" x="840" y="227.25">Issue</text>
          <text class="node-body" x="822" y="262.25">Reproducible public problem</text>
        </g>

        <g>
