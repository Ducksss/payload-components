  <rect class="node-card" x="52" y="225.5" width="350.6666666666667" height="116" rx="2" />
  <path class="node-rule" d="M 52 230.5 H 402.6666666666667" />
  <text class="node-index" x="68" y="251.5">01</text>
  <text class="node-title" x="95" y="252.5">Real install</text>
  <text class="node-body" data-role="body-line" x="68" y="282.5">Source meets a supported project</text>
</g>
<g class="node node--standard" data-node-id="evidence" data-node-kind="standard">
  <rect class="node-card" x="424.6666666666667" y="225.5" width="350.6666666666667" height="116" rx="2" />
  <path class="node-rule" d="M 424.6666666666667 230.5 H 775.3333333333334" />
  <text class="node-index" x="440.6666666666667" y="251.5">02</text>
  <text class="node-title" x="467.6666666666667" y="252.5">Evidence</text>
  <text class="node-body" data-role="body-line" x="440.6666666666667" y="282.5">exact command · versions · sanitized context</text>
</g>
<g class="node node--standard" data-node-id="route" data-node-kind="standard">
