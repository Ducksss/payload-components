<g><path class="arrow" d="M 876 295.66666666666663 C 876 295.66666666666663, 876 329.66666666666663, 876 329.66666666666663" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 324 295.66666666666663 C 462 295.66666666666663, 462 499.3333333333333, 600 499.3333333333333" marker-end="url(#arrowhead)" /></g>
<g><path class="arrow" d="M 876 295.66666666666663 C 738 295.66666666666663, 738 499.3333333333333, 600 499.3333333333333" marker-end="url(#arrowhead)" /></g></g>
