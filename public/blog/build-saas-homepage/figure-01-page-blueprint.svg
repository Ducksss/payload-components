  <rect class="node-card" x="52" y="279" width="209.6" height="116" rx="2" />
  <path class="node-rule" d="M 52 284 H 261.6" />
  <text class="node-index" x="68" y="305">01</text>
  <text class="node-title" x="95" y="306">1 · Promise</text>
  <text class="node-body" data-role="body-line" x="68" y="336">Hero names the useful</text>
<text class="node-body" data-role="body-line" x="68" y="352">change</text>
</g>
<g class="node node--standard" data-node-id="proof" data-node-kind="standard">
  <rect class="node-card" x="273.6" y="279" width="209.6" height="116" rx="2" />
  <path class="node-rule" d="M 273.6 284 H 483.20000000000005" />
  <text class="node-index" x="289.6" y="305">02</text>
  <text class="node-title" x="316.6" y="306">2 · Proof</text>
  <text class="node-body" data-role="body-line" x="289.6" y="336">Logos + evidence reduce</text>
<text class="node-body" data-role="body-line" x="289.6" y="352">doubt</text>
</g>
<g class="node node--standard" data-node-id="explain" data-node-kind="standard">
  <rect class="node-card" x="495.2" y="279" width="209.6" height="116" rx="2" />
  <path class="node-rule" d="M 495.2 284 H 704.8" />
  <text class="node-index" x="511.2" y="305">03</text>
  <text class="node-title" x="538.2" y="306">3 · Explain</text>
  <text class="node-body" data-role="body-line" x="511.2" y="336">Features show how it</text>
<text class="node-body" data-role="body-line" x="511.2" y="352">works</text>
</g>
<g class="node node--standard" data-node-id="trust" data-node-kind="standard">
  <rect class="node-card" x="716.8" y="279" width="209.6" height="116" rx="2" />
  <path class="node-rule" d="M 716.8 284 H 926.4" />
  <text class="node-index" x="732.8" y="305">04</text>
  <text class="node-title" x="759.8" y="306">4 · Trust</text>
  <text class="node-body" data-role="body-line" x="732.8" y="336">FAQ addresses remaining</text>
<text class="node-body" data-role="body-line" x="732.8" y="352">risk</text>
</g>
<g class="node node--standard" data-node-id="action" data-node-kind="standard">
