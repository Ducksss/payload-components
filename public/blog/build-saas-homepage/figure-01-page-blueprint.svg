  </g>
  <text class="kicker" x="48" y="86">PAGE BLUEPRINT</text>
  <text class="headline" x="48" y="119">A complete homepage is a sequence of editorial jobs</text>
  <path class="accent-path" d="M 941 96 C 1004 83, 1054 105, 1138 81" />
  <circle class="registration" cx="1139" cy="81" r="8" />
  <g data-diagram-layer="edges">
    <g class="edge">
  <path class="edge-path" data-edge-from="promise" data-edge-to="proof" data-edge-axis="horizontal" d="M 263.6 337 C 265.1 337, 265.1 337, 266.6 337" marker-end="url(#journal-arrow)" />

</g>
<g class="edge">
  <path class="edge-path" data-edge-from="proof" data-edge-to="explain" data-edge-axis="horizontal" d="M 485.20000000000005 337 C 486.70000000000005 337, 486.70000000000005 337, 488.2 337" marker-end="url(#journal-arrow)" />

</g>
<g class="edge">
  <path class="edge-path" data-edge-from="explain" data-edge-to="trust" data-edge-axis="horizontal" d="M 706.8 337 C 708.3 337, 708.3 337, 709.8 337" marker-end="url(#journal-arrow)" />

</g>
<g class="edge">
  <path class="edge-path" data-edge-from="trust" data-edge-to="action" data-edge-axis="horizontal" d="M 928.3999999999999 337 C 929.9 337, 929.9 337, 931.4000000000001 337" marker-end="url(#journal-arrow)" />

</g>
  </g>
  <g data-diagram-layer="nodes">
