    <text class="provenance-line" x="48" y="590">/components</text>
  </g>

  <g data-journal-part="prompt" data-prompt="Map the smallest sequence that makes the page&apos;s argument clear.">
    <text class="footer-label" x="744" y="571">QUESTION FOR THE NEXT BUILDER</text>
    <text class="prompt" x="744" y="594">Map the smallest sequence that makes the</text>
<text class="prompt" x="744" y="613">page&apos;s argument clear.</text>
