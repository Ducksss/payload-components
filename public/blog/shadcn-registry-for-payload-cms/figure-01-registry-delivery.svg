<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="diagram-title diagram-description" class="diagram diagram--trace" data-mode="trace" data-series="installer-internals" data-issue="10">
  <title id="diagram-title">Source paths become portable JSON, then consumer-owned files</title>
  <desc id="diagram-description">The shadcn build resolves source content into public registry artifacts for direct file delivery.</desc>
